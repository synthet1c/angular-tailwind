<div class="w-full max-w-md mx-auto p-4">
  <select
    id="sort-select"
    class="w-full text-gray-300 border-gray-300 rounded-md shadow-sm focus:ring focus:ring-blue-300"
    (change)="sort($event)"
  >
    <option *ngFor="let option of sortingOptions" [value]="option">
      {{ option }}
    </option>
  </select>
</div>
