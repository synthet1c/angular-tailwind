<ng-container [formGroup]="chatRulesForm">

  <h2 class="text-2xl font-semibold text-slate-100 mb-4">Chat rules</h2>
  <p class="text-slate-400 mb-4">Use this to make custom rules for your super chats</p>

  <!-- Dynamically render chat rules -->
  <div formArrayName="rules">
    <div
      *ngFor="let rule of rulesFormArray.controls; let i = index"
      [formGroupName]="i"
      class="flex mb-4 gap-1"
    >
      <div class="flex-2">
        <app-select
          formControlName="key"
          id="key-{{ i }}"
          placeholder="Rule"
          [options]="chatRules"
          [value]="rule.get('key').value"
          (change)="onRuleChange($event)"
        ></app-select>
      </div>
      <div class="flex-2">
        <app-select
          formControlName="comparisonOperator"
          id="comparison-{{ i }}"
          placeholder="Comparison"
          [options]="comparisonOperators"
        ></app-select>
      </div>

      <div class="flex-1">
        @if (rule.get('key').value === 'role') {
          <app-select
            formControlName="value"
            id="key-{{ i }}"
            placeholder="Rule"
            [options]="chatRules"
            [value]="rule.get('key').value"
            (change)="onRuleChange($event)"
          ></app-select>
        } @else {
          <app-input
            formControlName="value"
            id="value-{{ i }}"
            placeholder="Value"
            type="text"
          />
        }

      </div>

      <div class="">
        <button
          type="button"
          (click)="removeRule(i)"
          class="bg-red-800 text-white px-4 py-2 rounded shadow hover:bg-red-700 mb-4"
        >
          X
        </button>
      </div>

    </div>
  </div>

  <!-- Add Rule Button -->
  <div class="flex justify-end">
    <button
      type="button"
      (click)="addRule()"
      class="bg-blue-600 text-white px-6 py-2 rounded shadow hover:bg-blue-700 transition justify-self-end"
    >
      Add Rule
    </button>
  </div>

</ng-container>
