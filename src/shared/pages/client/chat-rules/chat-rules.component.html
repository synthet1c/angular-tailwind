<ng-container [formGroup]="form">
  <fieldset [formGroupName]="formGroupName">
    <label>{{ label }}</label>
    <select id="rule-selector" formControlName="selectedRule">
      <option [value]="null" disabled>Please choose a rule</option>
      @for (rule of chatRules; track rule.key)  {
        <option [value]="rule.key">
          {{ rule.name }}
        </option>
      }
    </select>
  </fieldset>
</ng-container>
