<div class="max-w-md mx-auto bg-slate-800 rounded-lg shadow-md">
  <h2 class="text-2xl font-semibold text-slate-100 mb-4">Name</h2>
  <ng-container [formGroup]="basicInfoForm">

    <app-input
      type="text"
      formControlName="firstName"
      placeholder="Enter your First name"
      label="First name"
    ></app-input>

    <app-input
      type="text"
      formControlName="lastName"
      placeholder="Enter your Last name"
      label="Last name"
    ></app-input>

  </ng-container>
</div>
